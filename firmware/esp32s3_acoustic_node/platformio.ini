; PlatformIO Project Configuration File for VanRakshak ESP32-S3 Acoustic Node
; Target: ESP32-S3 DevKitC-1 with 8MB PSRAM + INMP441 I2S Mic + SX1262 LoRa

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
upload_speed = 921600

; Build Flags for Vector Extensions & PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_LORA_FREQ_MHZ=865.2
    -DCONFIG_LORA_SF=9
    -DCONFIG_LORA_BW=125.0
    -DCONFIG_LORA_CR=5
    -DCONFIG_LORA_TX_POWER=22

; Library Dependencies
lib_deps =
    jgromes/RadioLib @ ^6.4.2
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
